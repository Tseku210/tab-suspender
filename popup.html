<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        --bg: #1a1a1a;
        --bg-raised: #242424;
        --bg-hover: #2e2e2e;
        --row-hover: #222;
        --row-active: #1e2a3a;
        --border: #2a2a2a;
        --border-strong: #333;
        --border-hover: #444;
        --text: #e2e2e2;
        --heading: #fff;
        --muted: #888;
        --faint: #666;
        --group-name: #999;
        --group-name-hover: #ccc;
        --btn-text: #ccc;
        --btn-hover-text: #fff;
        --action-text: #aaa;
        --primary-bg: #2a4a8a;
        --primary-border: #3a5a9a;
        --primary-text: #cde;
        --primary-hover-bg: #345aaa;
        --primary-hover-border: #4a6aba;
        --focus: #4a6aba;
        --error-bg: #3a1f1f;
        --error-border: #5a2525;
        --error-text: #f0b0b0;
        --fallback-bg: #2e2e2e;
        --fallback-text: #999;
        --badge-active-bg: #1e3a2a;
        --badge-active-text: #6c9;
        --badge-asleep-bg: #2a2520;
        --badge-asleep-text: #a98;
        --badge-pinned-bg: #2a2535;
        --badge-pinned-text: #a8b;
        --badge-audible-bg: #2a2020;
        --badge-audible-text: #c88;
        --checkbox-border: #555;
        --checkbox-checked-bg: #2a4a8a;
        --checkbox-checked-border: #4a6aba;
        --checkbox-checked-text: #cde;
      }

      body.light {
        --bg: #ffffff;
        --bg-raised: #f4f4f4;
        --bg-hover: #eaeaea;
        --row-hover: #f6f6f6;
        --row-active: #e9f0fb;
        --border: #e6e6e6;
        --border-strong: #d8d8d8;
        --border-hover: #c4c4c4;
        --text: #222;
        --heading: #000;
        --muted: #777;
        --faint: #999;
        --group-name: #777;
        --group-name-hover: #333;
        --btn-text: #444;
        --btn-hover-text: #000;
        --action-text: #555;
        --primary-bg: #2f5fc4;
        --primary-border: #2a55b0;
        --primary-text: #fff;
        --primary-hover-bg: #2a55b0;
        --primary-hover-border: #234a99;
        --focus: #2f5fc4;
        --error-bg: #fdecec;
        --error-border: #f0c4c4;
        --error-text: #a33a3a;
        --fallback-bg: #e8e8e8;
        --fallback-text: #666;
        --badge-active-bg: #ddf2e4;
        --badge-active-text: #1e7a48;
        --badge-asleep-bg: #f1ebe2;
        --badge-asleep-text: #7a6244;
        --badge-pinned-bg: #ece7f6;
        --badge-pinned-text: #6a4d99;
        --badge-audible-bg: #fbe4e4;
        --badge-audible-text: #b04a4a;
        --checkbox-border: #bbb;
        --checkbox-checked-bg: #2f5fc4;
        --checkbox-checked-border: #2f5fc4;
        --checkbox-checked-text: #fff;
      }

      body {
        width: 360px;
        max-height: 500px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
        color: var(--text);
        background: var(--bg);
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      .header {
        padding: 12px 14px 8px;
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }

      .header-top {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
      }

      .header h1 {
        font-size: 14px;
        font-weight: 600;
        color: var(--heading);
      }

      .stats {
        margin-left: auto;
        font-size: 11px;
        color: var(--muted);
      }

      .theme-toggle {
        background: transparent;
        border: none;
        padding: 0 2px;
        font-size: 13px;
        line-height: 1;
        color: var(--muted);
        cursor: pointer;
        font-family: inherit;
      }

      .theme-toggle:hover {
        color: var(--heading);
      }

      .theme-toggle:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 1px;
      }

      .actions {
        display: flex;
        gap: 6px;
      }

      .btn {
        padding: 5px 10px;
        border: 1px solid var(--border-strong);
        border-radius: 6px;
        background: var(--bg-raised);
        color: var(--btn-text);
        font-size: 11px;
        cursor: pointer;
        transition: all 0.15s;
        font-family: inherit;
      }

      .btn:hover {
        background: var(--bg-hover);
        color: var(--btn-hover-text);
        border-color: var(--border-hover);
      }

      .btn:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 1px;
      }

      .btn-primary {
        background: var(--primary-bg);
        border-color: var(--primary-border);
        color: var(--primary-text);
      }

      .btn-primary:hover {
        background: var(--primary-hover-bg);
        border-color: var(--primary-hover-border);
        color: var(--primary-text);
      }

      .error-banner {
        display: none;
        padding: 8px 14px;
        background: var(--error-bg);
        border-bottom: 1px solid var(--error-border);
        color: var(--error-text);
        font-size: 11px;
        flex-shrink: 0;
      }

      .error-banner.is-visible {
        display: block;
      }

      .tab-list {
        overflow-y: auto;
        flex: 1;
        padding: 4px 0;
      }

      .tab-list::-webkit-scrollbar {
        width: 5px;
      }

      .tab-list::-webkit-scrollbar-track {
        background: transparent;
      }

      .tab-list::-webkit-scrollbar-thumb {
        background: var(--border-strong);
        border-radius: 3px;
      }

      .tab-item {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 14px 0 0;
      }

      .tab-item:hover {
        background: var(--row-hover);
      }

      .tab-item.is-active {
        background: var(--row-active);
      }

      .tab-item.is-asleep .tab-item-main {
        opacity: 0.45;
      }

      .tab-item-main {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 7px 4px 7px 14px;
        background: transparent;
        border: none;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }

      .tab-item-main:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: -2px;
      }

      .tab-favicon {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
        border-radius: 2px;
      }

      .tab-favicon-fallback {
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--fallback-bg);
        color: var(--fallback-text);
        font-size: 9px;
        font-weight: 600;
        line-height: 1;
      }

      .tab-info {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 1px;
      }

      .tab-title {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 12.5px;
        line-height: 1.3;
      }

      .tab-url {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 10.5px;
        color: var(--faint);
        line-height: 1.2;
      }

      .tab-badges {
        display: flex;
        gap: 3px;
        flex-shrink: 0;
      }

      .tab-badge {
        font-size: 9.5px;
        padding: 2px 6px;
        border-radius: 4px;
        font-weight: 500;
      }

      .badge-active {
        background: var(--badge-active-bg);
        color: var(--badge-active-text);
      }

      .badge-asleep {
        background: var(--badge-asleep-bg);
        color: var(--badge-asleep-text);
      }

      .badge-pinned {
        background: var(--badge-pinned-bg);
        color: var(--badge-pinned-text);
      }

      .badge-audible {
        background: var(--badge-audible-bg);
        color: var(--badge-audible-text);
      }

      .tab-action {
        flex-shrink: 0;
        padding: 3px 8px;
        border: 1px solid var(--border-strong);
        border-radius: 5px;
        background: var(--bg-raised);
        color: var(--action-text);
        font-size: 10.5px;
        cursor: pointer;
        transition: all 0.15s;
        white-space: nowrap;
        font-family: inherit;
      }

      .tab-action:hover {
        background: var(--bg-hover);
        color: var(--btn-hover-text);
        border-color: var(--border-hover);
      }

      .tab-action:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 1px;
      }

      .group-header {
        display: flex;
        align-items: center;
        gap: 7px;
        width: 100%;
        padding: 8px 14px 3px;
        background: transparent;
        border: none;
        color: inherit;
        font: inherit;
        text-align: left;
      }

      button.group-header {
        cursor: pointer;
      }

      button.group-header:hover .group-name {
        color: var(--group-name-hover);
      }

      button.group-header:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: -2px;
      }

      .group-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
      }

      .group-name {
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 10.5px;
        font-weight: 600;
        color: var(--group-name);
      }

      .section-divider {
        margin: 6px 0 2px;
        border-top: 1px solid var(--border);
      }

      .is-select-only {
        display: none;
      }

      body.is-selecting .is-select-only {
        display: block;
      }

      body.is-selecting #sleep-others,
      body.is-selecting #wake-all,
      body.is-selecting #select-toggle {
        display: none;
      }

      .btn:disabled {
        opacity: 0.5;
        pointer-events: none;
      }

      .tab-checkbox {
        width: 14px;
        height: 14px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--checkbox-border);
        border-radius: 4px;
        font-size: 10px;
        line-height: 1;
        color: transparent;
      }

      .tab-checkbox::after {
        content: "✓";
      }

      .tab-item.is-selected .tab-checkbox {
        background: var(--checkbox-checked-bg);
        border-color: var(--checkbox-checked-border);
        color: var(--checkbox-checked-text);
      }

      .tab-item.is-excluded .tab-item-main {
        opacity: 0.35;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="header-top">
        <h1>Tab Suspender</h1>
        <span class="stats" id="stats"></span>
        <button class="theme-toggle" id="theme-toggle" type="button" title="Toggle theme">☀</button>
      </div>
      <div class="actions">
        <button class="btn btn-primary" id="sleep-others">
          Sleep Others
        </button>
        <button class="btn" id="wake-all">Wake All</button>
        <button class="btn" id="select-toggle">Select</button>
        <button class="btn btn-primary is-select-only" id="sleep-selected">
          Sleep (0)
        </button>
        <button class="btn is-select-only" id="select-cancel">Cancel</button>
      </div>
    </div>
    <div class="error-banner" id="error-banner" role="alert"></div>
    <div class="tab-list" id="tab-list"></div>
    <script src="popup.js"></script>
  </body>
</html>
