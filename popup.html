<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 360px;
        max-height: 500px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
        color: #e2e2e2;
        background: #1a1a1a;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      .header {
        padding: 12px 14px 8px;
        border-bottom: 1px solid #2a2a2a;
        flex-shrink: 0;
      }

      .header-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
      }

      .header h1 {
        font-size: 14px;
        font-weight: 600;
        color: #fff;
      }

      .stats {
        font-size: 11px;
        color: #888;
      }

      .actions {
        display: flex;
        gap: 6px;
      }

      .btn {
        padding: 5px 10px;
        border: 1px solid #333;
        border-radius: 6px;
        background: #242424;
        color: #ccc;
        font-size: 11px;
        cursor: pointer;
        transition: all 0.15s;
        font-family: inherit;
      }

      .btn:hover {
        background: #2e2e2e;
        color: #fff;
        border-color: #444;
      }

      .btn:focus-visible {
        outline: 2px solid #4a6aba;
        outline-offset: 1px;
      }

      .btn-primary {
        background: #2a4a8a;
        border-color: #3a5a9a;
        color: #cde;
      }

      .btn-primary:hover {
        background: #345aaa;
        border-color: #4a6aba;
        color: #fff;
      }

      .error-banner {
        display: none;
        padding: 8px 14px;
        background: #3a1f1f;
        border-bottom: 1px solid #5a2525;
        color: #f0b0b0;
        font-size: 11px;
        flex-shrink: 0;
      }

      .error-banner.is-visible {
        display: block;
      }

      .tab-list {
        overflow-y: auto;
        flex: 1;
        padding: 4px 0;
      }

      .tab-list::-webkit-scrollbar {
        width: 5px;
      }

      .tab-list::-webkit-scrollbar-track {
        background: transparent;
      }

      .tab-list::-webkit-scrollbar-thumb {
        background: #333;
        border-radius: 3px;
      }

      .tab-item {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 14px 0 0;
      }

      .tab-item:hover {
        background: #222;
      }

      .tab-item.is-active {
        background: #1e2a3a;
      }

      .tab-item.is-suspended .tab-item-main {
        opacity: 0.45;
      }

      .tab-item-main {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 7px 4px 7px 14px;
        background: transparent;
        border: none;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }

      .tab-item-main:focus-visible {
        outline: 2px solid #4a6aba;
        outline-offset: -2px;
      }

      .tab-favicon {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
        border-radius: 2px;
      }

      .tab-favicon.is-hidden {
        display: none;
      }

      .tab-info {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 1px;
      }

      .tab-title {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 12.5px;
        line-height: 1.3;
      }

      .tab-url {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 10.5px;
        color: #666;
        line-height: 1.2;
      }

      .tab-badges {
        display: flex;
        gap: 3px;
        flex-shrink: 0;
      }

      .tab-badge {
        font-size: 9.5px;
        padding: 2px 6px;
        border-radius: 4px;
        font-weight: 500;
      }

      .badge-active {
        background: #1e3a2a;
        color: #6c9;
      }

      .badge-suspended {
        background: #2a2520;
        color: #a98;
      }

      .badge-pinned {
        background: #2a2535;
        color: #a8b;
      }

      .badge-audible {
        background: #2a2020;
        color: #c88;
      }

      .tab-action {
        flex-shrink: 0;
        padding: 3px 8px;
        border: 1px solid #333;
        border-radius: 5px;
        background: #242424;
        color: #aaa;
        font-size: 10.5px;
        cursor: pointer;
        transition: all 0.15s;
        white-space: nowrap;
        font-family: inherit;
      }

      .tab-action:hover {
        background: #2e2e2e;
        color: #fff;
        border-color: #444;
      }

      .tab-action:focus-visible {
        outline: 2px solid #4a6aba;
        outline-offset: 1px;
      }

      .empty {
        text-align: center;
        padding: 30px 14px;
        color: #555;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="header-top">
        <h1>Tab Suspender</h1>
        <span class="stats" id="stats"></span>
      </div>
      <div class="actions">
        <button class="btn btn-primary" id="suspend-others">
          Suspend Others
        </button>
        <button class="btn" id="unsuspend-all">Reload All</button>
      </div>
    </div>
    <div class="error-banner" id="error-banner" role="alert"></div>
    <div class="tab-list" id="tab-list"></div>
    <script src="popup.js"></script>
  </body>
</html>
