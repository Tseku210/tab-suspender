<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        color-scheme: light dark;
      }

      body {
        --bg: light-dark(#fff, #1a1a1a);
        --bg-raised: light-dark(#f4f4f4, #242424);
        --bg-hover: light-dark(#eaeaea, #2e2e2e);
        --row-hover: light-dark(#f6f6f6, #222);
        --row-active: light-dark(#e9f0fb, #1e2a3a);
        --border: light-dark(#e6e6e6, #2a2a2a);
        --border-strong: light-dark(#d8d8d8, #333);
        --border-hover: light-dark(#c4c4c4, #444);
        --text: light-dark(#222, #e2e2e2);
        --heading: light-dark(#000, #fff);
        --muted: light-dark(#777, #888);
        --faint: light-dark(#999, #666);
        --group-name: light-dark(#777, #999);
        --group-name-hover: light-dark(#333, #ccc);
        --btn-text: light-dark(#444, #ccc);
        --btn-hover-text: light-dark(#000, #fff);
        --action-text: light-dark(#555, #aaa);
        --primary-bg: light-dark(#2f5fc4, #2a4a8a);
        --primary-border: light-dark(#2a55b0, #3a5a9a);
        --primary-text: light-dark(#fff, #cde);
        --primary-hover-bg: light-dark(#2a55b0, #345aaa);
        --primary-hover-border: light-dark(#234a99, #4a6aba);
        --focus: light-dark(#2f5fc4, #4a6aba);
        --error-bg: light-dark(#fdecec, #3a1f1f);
        --error-border: light-dark(#f0c4c4, #5a2525);
        --error-text: light-dark(#a33a3a, #f0b0b0);
        --fallback-text: light-dark(#666, #999);
        --badge-active-bg: light-dark(#ddf2e4, #1e3a2a);
        --badge-active-text: light-dark(#1e7a48, #6c9);
        --asleep: light-dark(#7a6244, #cba);
        --badge-pinned-bg: light-dark(#ece7f6, #2a2535);
        --badge-pinned-text: light-dark(#6a4d99, #a8b);
        --badge-audible-bg: light-dark(#fbe4e4, #2a2020);
        --badge-audible-text: light-dark(#b04a4a, #c88);
        --checkbox-border: light-dark(#bbb, #555);
      }

      body {
        width: 360px;
        max-height: 500px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
        color: var(--text);
        background: var(--bg);
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      .header {
        padding: 12px 14px 8px;
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }

      .header-top {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
      }

      .header h1 {
        font-size: 14px;
        font-weight: 600;
        color: var(--heading);
      }

      .stats {
        margin-left: auto;
        font-size: 11px;
        color: var(--muted);
      }

      .theme-toggle {
        background: transparent;
        border: none;
        padding: 0 2px;
        font-size: 13px;
        line-height: 1;
        color: var(--muted);
        cursor: pointer;
        font-family: inherit;
      }

      .theme-toggle:hover {
        color: var(--heading);
      }

      .actions {
        display: flex;
        gap: 6px;
      }

      .btn {
        padding: 5px 10px;
        border: 1px solid var(--border-strong);
        border-radius: 6px;
        background: var(--bg-raised);
        color: var(--btn-text);
        font-size: 11px;
        cursor: pointer;
        transition: all 0.15s;
        font-family: inherit;
      }

      .btn:hover {
        background: var(--bg-hover);
        color: var(--btn-hover-text);
        border-color: var(--border-hover);
      }

      .btn-primary {
        background: var(--primary-bg);
        border-color: var(--primary-border);
        color: var(--primary-text);
      }

      .btn-primary:hover {
        background: var(--primary-hover-bg);
        border-color: var(--primary-hover-border);
        color: var(--primary-text);
      }

      .filter {
        width: 100%;
        margin-top: 8px;
        padding: 5px 8px;
        border: 1px solid var(--border-strong);
        border-radius: 6px;
        background: var(--bg-raised);
        color: var(--text);
        font: inherit;
        font-size: 12px;
        outline: none;
      }

      .filter:focus {
        border-color: var(--focus);
      }

      .tab-list:empty::after {
        content: "No matching tabs";
        display: block;
        padding: 16px 14px;
        color: var(--muted);
        font-size: 11px;
      }

      .tab-age {
        margin-left: 6px;
      }

      .error-banner {
        display: none;
        padding: 8px 14px;
        background: var(--error-bg);
        border-bottom: 1px solid var(--error-border);
        color: var(--error-text);
        font-size: 11px;
        flex-shrink: 0;
      }

      .error-banner.is-visible {
        display: block;
      }

      .tab-list {
        scrollbar-width: thin;
        scrollbar-color: var(--border-strong) transparent;
        overflow-y: auto;
        flex: 1;
        padding: 4px 0;
      }

      .tab-item {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 14px 0 0;
      }

      .tab-item:hover {
        background: var(--row-hover);
      }

      .tab-item.is-active {
        background: var(--row-active);
      }

      .is-asleep .tab-info {
        opacity: 0.45;
      }

      .tab-icon {
        position: relative;
        display: flex;
        flex-shrink: 0;
      }

      .is-asleep .tab-favicon {
        filter: grayscale(1);
        opacity: 0.4;
      }

      .is-asleep .tab-icon::after {
        content: "☾";
        position: absolute;
        right: -5px;
        bottom: -5px;
        font-size: 11px;
        line-height: 1;
        color: var(--asleep);
        text-shadow: 0 0 2px var(--bg), 0 0 2px var(--bg);
      }

      .tab-item-main {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 7px 4px 7px 14px;
        background: transparent;
        border: none;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }

      :focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 1px;
      }

      .tab-item-main:focus-visible,
      .group-header:focus-visible {
        outline-offset: -2px;
      }

      .tab-favicon {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
        border-radius: 2px;
      }

      .tab-favicon-fallback {
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg-hover);
        color: var(--fallback-text);
        font-size: 9px;
        font-weight: 600;
        line-height: 1;
      }

      .tab-info {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 1px;
      }

      .tab-title {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 12.5px;
        line-height: 1.3;
      }

      .tab-url {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 10.5px;
        color: var(--faint);
        line-height: 1.2;
      }

      .tab-badges {
        display: flex;
        gap: 3px;
        flex-shrink: 0;
      }

      .tab-badge {
        font-size: 9.5px;
        padding: 2px 6px;
        border-radius: 4px;
        font-weight: 500;
      }

      .badge-active {
        background: var(--badge-active-bg);
        color: var(--badge-active-text);
      }

      .badge-pinned {
        background: var(--badge-pinned-bg);
        color: var(--badge-pinned-text);
      }

      .badge-playing {
        background: var(--badge-audible-bg);
        color: var(--badge-audible-text);
      }

      .tab-action {
        flex-shrink: 0;
        padding: 3px 8px;
        border: 1px solid var(--border-strong);
        border-radius: 5px;
        background: var(--bg-raised);
        color: var(--action-text);
        font-size: 10.5px;
        cursor: pointer;
        transition: all 0.15s;
        white-space: nowrap;
        font-family: inherit;
      }

      .tab-action:hover {
        background: var(--bg-hover);
        color: var(--btn-hover-text);
        border-color: var(--border-hover);
      }

      .group-header {
        display: flex;
        align-items: center;
        gap: 7px;
        width: 100%;
        padding: 8px 14px 3px;
        background: transparent;
        border: none;
        color: inherit;
        font: inherit;
        text-align: left;
      }

      button.group-header {
        cursor: pointer;
      }

      button.group-header:hover .group-name {
        color: var(--group-name-hover);
      }

      .group-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
      }

      .group-name {
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 10.5px;
        font-weight: 600;
        color: var(--group-name);
      }

      .section-divider {
        margin: 6px 0 2px;
        border-top: 1px solid var(--border);
      }

      .is-select-only {
        display: none;
      }

      body.is-selecting .is-select-only {
        display: block;
      }

      body.is-selecting #sleep-others,
      body.is-selecting #wake-all,
      body.is-selecting #select-toggle {
        display: none;
      }

      .btn:disabled {
        opacity: 0.5;
        pointer-events: none;
      }

      .tab-checkbox {
        width: 14px;
        height: 14px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--checkbox-border);
        border-radius: 4px;
        font-size: 10px;
        line-height: 1;
        color: transparent;
      }

      .tab-checkbox::after {
        content: "✓";
      }

      .tab-item.is-selected .tab-checkbox {
        background: var(--primary-bg);
        border-color: var(--focus);
        color: var(--primary-text);
      }

      .tab-item.is-excluded .tab-item-main {
        opacity: 0.35;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="header-top">
        <h1>Tab Suspender</h1>
        <span class="stats" id="stats"></span>
        <button class="theme-toggle" id="theme-toggle" type="button"></button>
      </div>
      <div class="actions">
        <button class="btn btn-primary" id="sleep-others">
          Sleep Others
        </button>
        <button class="btn" id="wake-all">Wake All</button>
        <button class="btn" id="select-toggle">Select</button>
        <button class="btn btn-primary is-select-only" id="sleep-selected">
          Sleep (0)
        </button>
        <button class="btn is-select-only" id="select-cancel">Cancel</button>
      </div>
      <input class="filter" id="filter" type="search" placeholder="Filter tabs" aria-label="Filter tabs" autofocus />
    </div>
    <div class="error-banner" id="error-banner" role="alert"></div>
    <div class="tab-list" id="tab-list"></div>
    <script src="popup.js"></script>
  </body>
</html>
