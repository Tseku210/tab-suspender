<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a5fe0"/>
      <stop offset="1" stop-color="#2d2f9e"/>
    </linearGradient>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#141660" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="128" height="128" rx="30" fill="url(#bg)"/>
  <!-- browser window: tab strip with dots + content area with pause bars -->
  <g filter="url(#soft)">
    <path d="M 26 40
             q 0 -8 8 -8
             h 24
             q 5 0 8 5
             l 2.5 4
             q 2 3.5 6 3.5
             h 19.5
             q 8 0 8 8
             v 43.5
             q 0 8 -8 8
             h -60
             q -8 0 -8 -8
             z" fill="#ffffff"/>
  </g>
  <!-- dots on the tab strip -->
  <g fill="#3d40b8">
    <circle cx="36.5" cy="41.5" r="3.4"/>
    <circle cx="47.5" cy="41.5" r="3.4"/>
    <circle cx="58.5" cy="41.5" r="3.4"/>
  </g>
  <!-- divider under tab strip -->
  <rect x="26" y="50" width="76" height="2.5" fill="#3d40b8" opacity="0.55"/>
  <!-- pause bars -->
  <g fill="#3d40b8">
    <rect x="52" y="61" width="9.5" height="30" rx="4.75"/>
    <rect x="66.5" y="61" width="9.5" height="30" rx="4.75"/>
  </g>
</svg>
